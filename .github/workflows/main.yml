name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: english-cat-android/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PAPI_BASE_URL=https://engapp-backend.onrender.com/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: english-cat-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

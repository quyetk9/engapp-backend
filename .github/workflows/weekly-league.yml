name: Weekly league rollover
on:
  schedule: [{ cron: "5 0 * * 1" }]   # 00:05 UTC thứ Hai
  workflow_dispatch:
jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/admin/league/rollover" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
